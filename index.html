<script>
const ENC = JSON.parse(document.getElementById('enc').textContent);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function tryDecrypt(pw) {
  const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64d(ENC.salt), iterations: 200000, hash: 'SHA-256' },
    keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(ENC.iv) }, key, b64d(ENC.ct));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

async function attempt(pw, silent) {
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Opening…';
  try {
    const html = await tryDecrypt(pw);
    try { localStorage.setItem('fjb_pw', pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Open board';
    if (!silent) document.getElementById('err').style.display = 'block';
  }
}

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  attempt(document.getElementById('pw').value.trim(), false);
});

try {
  const saved = localStorage.getItem('fjb_pw');
  if (saved) attempt(saved, true);
} catch (e) {}
</script>
